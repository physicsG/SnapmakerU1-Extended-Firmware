# Service-owned Moonraker agent configuration consumed by Filament Manager.
# S99openrfid always loads this file after reader/user projections and may
# append a marker-gated runtime override. Static write defaults stay closed.

[openrfid_agent_event_exporter]
events = tag_read,tag_parse_error,tag_not_present
max_queued = 64

[openrfid_api]
moonraker_socket_path = /oem/printer_data/comms/moonraker.sock
enable_write = false
allow_unrecognized_write = false
allow_legacy_migration_write = false
