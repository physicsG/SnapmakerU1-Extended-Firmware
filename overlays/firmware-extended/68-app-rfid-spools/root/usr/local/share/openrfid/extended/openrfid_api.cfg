# OpenRFID Moonraker agent integration for the rfid-spools SPA.
#
# Installed by the 68-app-rfid-spools overlay. Provides the
# `openrfid/*` JSON-RPC remote methods and `notify_agent_event`
# broadcasts that the SPA at /spools/ consumes via the existing
# Moonraker WebSocket.
#
# `enable_write` here is the safe default. The S99openrfid init
# script generates a runtime override at /tmp/openrfid_api_overrides.cfg
# that promotes it to true when [components] rfid_write = true in
# /oem/printer_data/config/extended/extended2.cfg.

[openrfid_agent_event_exporter]
events = tag_read,tag_parse_error,tag_not_present
max_queued = 64

[openrfid_api]
moonraker_socket_path = /oem/printer_data/comms/moonraker.sock
enable_write = false
