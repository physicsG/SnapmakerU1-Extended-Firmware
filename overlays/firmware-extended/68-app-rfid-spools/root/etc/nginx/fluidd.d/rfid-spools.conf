# RFID Spools Management UI (static SPA).
#
# All dynamic data flows through the existing Moonraker connection:
#   - openrfid/* JSON-RPC remote methods exposed by the OpenRFID
#     agent (see openrfid_api.cfg)
#   - /server/spoolman/proxy for Spoolman queries
#   - notify_agent_event(openrfid/scan) for live scan updates
# No local API backend is required; nginx serves static assets only.

location = /spools {
    return 301 /spools/;
}

location /spools/ {
    auth_request /auth_check;
    alias /usr/local/share/rfid-spools/html/;
    index index.html;
}

# TigerTag database JSONs shipped by OpenRFID (id_material.json, etc.).
# The SPA fetches these directly to populate registry-backed dropdowns
# instead of going through a Python backend. Path under /spools/static/
# keeps everything under one auth_request umbrella.
location /spools/static/openrfid/database/ {
    auth_request /auth_check;
    alias /usr/local/share/openrfid/tag/tigertag/database/;
    add_header Cache-Control "public, max-age=3600";
}
